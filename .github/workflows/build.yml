name: Build & Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "release = tag + GitHub release, draft = draft release, check-only = tests only"
        required: true
        default: release
        type: choice
        options: [release, draft, check-only]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Releases only from main
        if: github.event_name == 'workflow_dispatch' && inputs.build_type != 'check-only' && github.ref != 'refs/heads/main'
        shell: powershell
        run: |
          throw "Releases are built from main only (this run is $env:GITHUB_REF)"

      - uses: actions/checkout@v4

      - name: Smoke test (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\smoke_test.ps1

      - name: Signing test (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\signing_test.ps1

      - name: Module tests (Windows PowerShell 5.1, dry runs only)
        shell: powershell
        run: |
          $env:UPDATECENTER_DATADIR = Join-Path $env:RUNNER_TEMP 'uc-data'
          $failed = @()
          foreach ($t in 'cleanup_test', 'securityscan_test', 'startup_test', 'uninstaller_test', 'vendorupdates_test') {
            Write-Host "== $t"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "tests\$t.ps1"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed) { throw "Module tests failed: $($failed -join ', ')" }

      - name: Lint (PSScriptAnalyzer, errors only)
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.21.0 -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer found $($issues.Count) error(s)" }

      # ---- Packaging with optional code signing -------------------------------------------------
      # Signing is optional (see docs/CODE_SIGNING.md). Without signing secrets the build stays unsigned.
      - name: Stage package and detect signing mode
        if: github.event_name == 'workflow_dispatch' && inputs.build_type != 'check-only'
        id: stage
        shell: powershell
        env:
          HAS_PFX: ${{ secrets.SIGN_PFX_BASE64 != '' && secrets.SIGN_PFX_PASSWORD != '' }}
          HAS_TS: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.TS_ENDPOINT != '' && vars.TS_ACCOUNT != '' && vars.TS_PROFILE != '' }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $stage = Join-Path $env:RUNNER_TEMP 'pkg'
          $tmpZip = Join-Path $env:RUNNER_TEMP 'raw.zip'
          git archive --format=zip -o $tmpZip HEAD
          Expand-Archive -Path $tmpZip -DestinationPath $stage -Force
          Remove-Item $tmpZip
          # git archive stamps files with the commit time; give them the build time so no client-side
          # cleanup of "old" cache files can ever touch a freshly downloaded package.
          $now = Get-Date
          Get-ChildItem $stage -Recurse -File -Force | ForEach-Object { $_.LastWriteTime = $now }
          $mode = 'none'
          if ($env:HAS_PFX -eq 'true') { $mode = 'pfx' } elseif ($env:HAS_TS -eq 'true') { $mode = 'ts' }
          if ($mode -eq 'none') { Write-Host '::notice::No signing secrets configured - building an UNSIGNED package (see docs/CODE_SIGNING.md).' }
          else { Write-Host "Signing mode: $mode" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "stage=$stage" >> $env:GITHUB_OUTPUT

      - name: Sign package (PFX certificate)
        if: steps.stage.outputs.mode == 'pfx'
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          STAGE: ${{ steps.stage.outputs.stage }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            & .\tools\sign.ps1 -Root $env:STAGE -PfxPath $pfx | Out-Null
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Sign scripts (Azure Trusted Signing)
        if: steps.stage.outputs.mode == 'ts'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.TS_PROFILE }}
          files-folder: ${{ steps.stage.outputs.stage }}
          files-folder-filter: ps1,psm1
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Create file catalog (Azure Trusted Signing)
        if: steps.stage.outputs.mode == 'ts'
        shell: powershell
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: |
          # The catalog must be created AFTER the scripts were signed (their hashes changed).
          $dir = Join-Path $env:RUNNER_TEMP 'catsign'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          New-FileCatalog -Path $env:STAGE -CatalogFilePath (Join-Path $dir 'UpdateCenter.cat') -CatalogVersion 2 | Out-Null

      - name: Sign file catalog (Azure Trusted Signing)
        if: steps.stage.outputs.mode == 'ts'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.TS_PROFILE }}
          files-folder: ${{ runner.temp }}\catsign
          files-folder-filter: cat
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package (ZIP + SHA-256 + Setup.exe)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type != 'check-only'
        id: pkg
        shell: powershell
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          VERSION: ${{ steps.stage.outputs.version }}
          MODE: ${{ steps.stage.outputs.mode }}
        run: |
          $version = $env:VERSION
          $stage = $env:STAGE
          if ($env:MODE -eq 'ts') {
            Move-Item (Join-Path $env:RUNNER_TEMP 'catsign\UpdateCenter.cat') (Join-Path $stage 'UpdateCenter.cat') -Force
          }
          if (Test-Path (Join-Path $stage 'UpdateCenter.cat')) {
            Import-Module (Join-Path $stage 'src\Signing.psm1') -Force
            $s = Get-PackageSignature -Root $stage
            Write-Host ("Package signature: signed={0} valid={1} status={2} signer={3} catalogOk={4}" -f $s.Signed, $s.Valid, $s.Status, $s.Subject, $s.CatalogOk)
            if (-not $s.CatalogOk -or -not $s.Valid) { throw "Signed package failed verification: $($s.Mismatches -join '; ')" }
          }
          $zip = "UpdateCenter-v$version.zip"
          # Entries are written one by one with '/' separators (zip standard). CreateFromDirectory and
          # Compress-Archive on .NET Framework / PS 5.1 write '\' instead.
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $root = (Resolve-Path $stage).ProviderPath.TrimEnd('\') + '\'
          $archive = [IO.Compression.ZipFile]::Open((Join-Path (Get-Location) $zip), [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($file in Get-ChildItem $stage -Recurse -File -Force) {
              $entry = $file.FullName.Substring($root.Length).Replace('\', '/')
              [void][IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $file.FullName, $entry, [IO.Compression.CompressionLevel]::Optimal)
            }
          } finally { $archive.Dispose() }
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File "$zip.sha256" -Encoding ascii
          # Same package under the v1.x name so "ALERION Update" installations can self-update.
          $legacy = "ALERION-Update-v$version.zip"
          Copy-Item $zip $legacy
          (Get-FileHash $legacy -Algorithm SHA256).Hash.ToLower() + "  $legacy" | Out-File "$legacy.sha256" -Encoding ascii
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\build-setup.ps1 -Zip (Resolve-Path $zip)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Sign Setup.exe (PFX certificate)
        if: steps.stage.outputs.mode == 'pfx' && github.event_name == 'workflow_dispatch' && inputs.build_type != 'check-only'
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            & .\tools\sign.ps1 -FilesOnly -PfxPath $pfx -ExtraFiles "UpdateCenter-Setup-v$($env:VERSION).exe" | Out-Null
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Sign Setup.exe (Azure Trusted Signing)
        if: steps.stage.outputs.mode == 'ts' && github.event_name == 'workflow_dispatch' && inputs.build_type != 'check-only'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.TS_PROFILE }}
          files: ${{ github.workspace }}\UpdateCenter-Setup-v${{ steps.pkg.outputs.version }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify package (what clients will install)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type != 'check-only'
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "UpdateCenter-v$version.zip"
          $x = Join-Path $env:RUNNER_TEMP 'verify'
          Expand-Archive -Path $zip -DestinationPath $x -Force
          foreach ($r in @('VERSION', 'Install.ps1', 'src\Common.psm1', 'src\Providers.psm1', 'src\UpdateEngine.ps1', 'src\Gui.ps1', 'src\Gui.xaml', 'src\GuiModel.cs', 'src\Scheduler.psm1', 'src\Report.psm1', 'src\i18n.json', 'src\config.default.json', 'assets\icon.ico')) {
            $p = Join-Path $x $r
            if (-not (Test-Path $p -PathType Leaf) -or (Get-Item $p).Length -eq 0) { throw "Package incomplete: $r" }
          }
          if ((Get-Content (Join-Path $x 'VERSION') -Raw).Trim() -ne $version) { throw 'VERSION mismatch in package' }
          $exp = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0]
          if ($exp -ne (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()) { throw 'SHA-256 mismatch' }
          Write-Host "Package OK: $zip"

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.build_type != 'check-only'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.pkg.outputs.version }}"
          $flags = @()
          if ('${{ inputs.build_type }}' -eq 'draft') { $flags += '--draft' }
          gh release create "v$v" "UpdateCenter-v$v.zip" "UpdateCenter-v$v.zip.sha256" "UpdateCenter-Setup-v$v.exe" `
            "ALERION-Update-v$v.zip" "ALERION-Update-v$v.zip.sha256" --title "Update Center v$v" --notes-file CHANGELOG.md @flags
